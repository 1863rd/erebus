[project]
name = "erebus"
version = "2.0.0"
description = "Offensive web pentesting framework with WAF evasion, auto-exploitation, and C2"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "colorama>=0.4.6",
    "beautifulsoup4>=4.12.0",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "pycryptodome>=3.20.0",
]

[project.scripts]
erebus = "erebus:main"
